<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Signal lost · HyperLife</title>
    <meta name="description" content="This HyperLife page drifted out of orbit." />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --space: #0a0a23;
        --panel: #17173f;
        --lavender: #b9a5ff;
        --gold: #ffd24a;
        --pink: #ff6ec7;
        --sky: #6dd8ff;
        --foreground: #f3f0ff;
        --muted: #a7a2cc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 20%, rgba(185, 165, 255, 0.16), transparent 42%),
          radial-gradient(circle at 80% 70%, rgba(255, 110, 199, 0.14), transparent 40%),
          var(--space);
        color: var(--foreground);
        font-family: "VT323", ui-monospace, monospace;
      }
      .panel {
        width: 100%;
        max-width: 620px;
        background: var(--panel);
        border: 3px solid var(--lavender);
        box-shadow:
          0 0 0 3px var(--space),
          8px 8px 0 0 #05051a;
        padding: 32px 24px;
        text-align: center;
      }
      .kicker {
        margin: 0 0 18px;
        color: var(--sky);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: var(--gold);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: clamp(28px, 9vw, 56px);
        line-height: 1.2;
        text-shadow: 6px 6px 0 #05051a;
      }
      h2 {
        margin: 22px 0 0;
        color: var(--pink);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.7;
        text-transform: uppercase;
      }
      p {
        margin: 16px auto 0;
        max-width: 44ch;
        color: var(--muted);
        font-size: 22px;
        line-height: 1.25;
      }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 14px 22px;
        background: var(--gold);
        color: var(--space);
        border: 3px solid var(--space);
        box-shadow: 4px 4px 0 0 var(--space);
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover {
        filter: brightness(1.1);
      }
      a:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }
      a:focus-visible {
        outline: 3px solid var(--sky);
        outline-offset: 3px;
      }
      .stars {
        margin-top: 24px;
        color: var(--lavender);
        font-size: 16px;
        letter-spacing: 6px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <p class="kicker">◀ Mission control</p>
      <h1>404</h1>
      <h2>Signal lost</h2>
      <p>This page drifted out of orbit. Reconnect to the crew terminal to keep monitoring your mission.</p>
      <a href="/">Return to HyperLife</a>
      <div class="stars" aria-hidden="true">✦ ✧ ✦ ✧ ✦</div>
    </main>
  </body>
</html>
